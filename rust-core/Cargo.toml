[package]
name = "oma_core"
version = "0.12.1"
edition = "2021"
description = "OMA analytics core — indicators, technical, backtest, MPB math"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional WASM bindings — enable with --features wasm
[dependencies.wasm-bindgen]
version = "0.2.92"
optional = true

[dependencies.serde-wasm-bindgen]
version = "0.6"
optional = true

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
